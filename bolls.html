<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Salto — Jogo de Obstáculos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #07070d;
    touch-action: none;
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #game { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: 18px 22px;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-variant-numeric: tabular-nums;
  }

  .lbl {
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(180,170,220,.6); font-weight: 700;
  }

  .score {
    font-size: 42px; font-weight: 800; line-height: 1;
    letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff, #b7a4ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 34px rgba(127,90,240,.35); margin-top: 4px;
  }

  .right { text-align: right; display: flex; flex-direction: column; gap: 6px; }

  .best {
    font-size: 22px; font-weight: 700; line-height: 1;
    color: #8ef0c4; text-shadow: 0 0 22px rgba(44,182,125,.45);
  }

  .speedWrap {
    display: flex; align-items: center; gap: 8px;
    justify-content: flex-end; margin-top: 4px;
  }

  .speedBar {
    width: 92px; height: 5px; border-radius: 99px;
    background: rgba(255,255,255,.1); overflow: hidden;
  }

  .speedBar i {
    display: block; height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #7f5af0, #ff4d6d);
    box-shadow: 0 0 12px rgba(255,77,109,.7);
    transition: width .12s linear;
  }

  #speedTxt { font-size: 11px; font-weight: 700; color: #c3b0ff; letter-spacing: .04em; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 22px;
    background: radial-gradient(ellipse at center, rgba(20,14,40,.55), rgba(5,4,12,.9));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity .35s ease, visibility .35s; z-index: 10;
  }

  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .card {
    width: min(430px, 100%); text-align: center; padding: 38px 30px 32px;
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(38,30,66,.92), rgba(16,12,30,.94));
    border: 1px solid rgba(150,120,255,.22);
    box-shadow: 0 34px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    animation: pop .4s cubic-bezier(.2,.9,.3,1.4);
  }

  @keyframes pop {
    from { transform: scale(.9); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }

  .card h1 {
    font-size: 34px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 12px;
    background: linear-gradient(120deg, #fff, #a78bfa 55%, #2cb67d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .card p { font-size: 14.5px; line-height: 1.65; color: rgba(225,220,245,.82); }
  .card .dim { color: rgba(180,170,215,.6); font-size: 13px; }
  .card strong { color: #8ef0c4; font-size: 18px; }

  kbd {
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18); border-bottom-width: 2px;
    color: #fff;
  }

  .card button {
    margin-top: 26px; width: 100%; padding: 15px;
    font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .02em;
    color: #fff; cursor: pointer; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #7f5af0, #a855f7 60%, #7c3aed);
    box-shadow: 0 12px 32px rgba(127,90,240,.45);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }

  .card button:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(127,90,240,.6); }
  .card button:active { transform: translateY(0) scale(.98); }

  .overlay.over .card h1 {
    background: linear-gradient(120deg, #ff9a9e, #ff4d6d 50%, #ff8a5c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .overlay.over .card button {
    background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
    box-shadow: 0 12px 32px rgba(255,77,109,.42);
  }

  @media (max-width: 520px) {
    .score { font-size: 34px; }
    .card h1 { font-size: 27px; }
    .card { padding: 30px 22px 26px; }
    .hud { padding: 14px 16px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div>
    <div class="lbl">Pontos</div>
    <div class="score" id="score">0</div>
  </div>

  <div class="right">
    <div class="lbl">Recorde</div>
    <div class="best" id="best">0</div>
    <div class="speedWrap">
      <div class="speedBar"><i id="speedFill"></i></div>
      <div id="speedTxt">x1.0</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h1 id="ovTitle">Salto</h1>
    <p id="ovDesc">Clique, toque ou pressione <kbd>Espaço</kbd> para saltar.<br>
      <span class="dim">A velocidade aumenta com o tempo. Sobreviva o máximo que puder.</span>
    </p>
    <button id="ovBtn">Começar</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     CONFIGURAÇÃO
     ========================================================= */
  const CFG = {
    gravity:   2600,     // px/s²
    jumpV:     -880,     // impulso do salto
    ballR:     17,
    speedStart: 300,     // px/s
    speedMax:   950,
    speedGain:  8.5,     // px/s ganhos por segundo
    scoreRate:  0.06     // pontos por pixel percorrido
  };

  /* Constantes derivadas da física do salto */
  const AIR_TIME   = (2 * Math.abs(CFG.jumpV)) / CFG.gravity;   // ~0.677s
  const JUMP_HEIGHT = (CFG.jumpV * CFG.jumpV) / (2 * CFG.gravity); // ~148.9px

  /* =========================================================
     CANVAS
     ========================================================= */
  const canvas = document.getElementById("game");
  const ctx    = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1, groundY = 0;

  /* =========================================================
     ESTADO
     ========================================================= */
  const state = {
    phase: "ready",          // ready | playing | over
    time: 0,
    t: 0,
    speed: CFG.speedStart,
    score: 0,
    scroll: 0,
    shake: 0,
    flash: 0,
    spawnCooldown: 720,
    obstacles: [],
    particles: [],
    trail: [],
    ball: { x: 90, y: 0, vy: 0, r: CFG.ballR, onGround: true, squash: 0, rot: 0, coyote: 0, jumpBuf: 0 }
  };

  let best = 0;
  try { best = Number(localStorage.getItem("salto_best") || 0) || 0; } catch (e) { best = 0; }

  let overAt = 0;
  let stars = [];

  /* =========================================================
     ELEMENTOS DOM
     ========================================================= */
  const overlay      = document.getElementById("overlay");
  const overlayTitle = document.getElementById("ovTitle");
  const overlayDesc  = document.getElementById("ovDesc");
  const overlayBtn   = document.getElementById("ovBtn");
  const scoreEl      = document.getElementById("score");
  const bestEl       = document.getElementById("best");
  const speedFill    = document.getElementById("speedFill");
  const speedTxt     = document.getElementById("speedTxt");

  /* =========================================================
     REDIMENSIONAMENTO
     ========================================================= */
  function resize() {
    const oldGround = groundY;

    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    groundY = Math.round(H - Math.min(150, Math.max(72, H * 0.18)));

    if (oldGround && state.obstacles.length) {
      const dy = groundY - oldGround;
      for (const o of state.obstacles) o.y += dy;
    }

    const b = state.ball;
    b.x = Math.max(72, W * 0.2);
    if (b.onGround || state.phase !== "playing") b.y = groundY - b.r;

    makeStars();
  }

  function makeStars() {
    const count = Math.round(Math.min(110, Math.max(45, W / 14)));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * groundY * 0.92,
      r: 0.5 + Math.random() * 1.5,
      depth: 0.08 + Math.random() * 0.5,
      tw: Math.random() * Math.PI * 2
    }));
  }

  /* =========================================================
     CONTROLE DE FLUXO
     ========================================================= */
  function startGame() {
    state.phase = "playing";
    state.t = 0;
    state.time = 0;
    state.speed = CFG.speedStart;
    state.score = 0;
    state.scroll = 0;
    state.shake = 0;
    state.flash = 0;
    state.spawnCooldown = 720;
    state.obstacles.length = 0;
    state.particles.length = 0;
    state.trail.length = 0;

    const b = state.ball;
    b.x = Math.max(72, W * 0.2);
    b.y = groundY - b.r;
    b.vy = 0;
    b.onGround = true;
    b.squash = 0;
    b.rot = 0;
    b.coyote = 0;
    b.jumpBuf = 0;

    overlay.classList.add("hidden");
    updateHUD();
  }

  function showReady() {
    state.phase = "ready";
    overlay.classList.remove("over");
    overlayTitle.textContent = "Salto";
    overlayDesc.innerHTML =
      'Clique, toque ou pressione <kbd>Espaço</kbd> para saltar.<br>' +
      '<span class="dim">A velocidade aumenta com o tempo. Sobreviva o máximo que puder.</span>';
    overlayBtn.textContent = "Começar";
    overlay.classList.remove("hidden");
  }

  function gameOver() {
    state.phase = "over";
    overAt = performance.now();
    state.shake = 26;
    state.flash = 1;

    const b = state.ball;
    burst(b.x, b.y, 30, "#ff4d6d", 520);
    burst(b.x, b.y, 14, "#ffd166", 340);

    const s = Math.floor(state.score);
    if (s > best) {
      best = s;
      try { localStorage.setItem("salto_best", String(best)); } catch (e) {}
    }

    overlay.classList.add("over");
    overlayTitle.textContent = "Fim de jogo";
    overlayDesc.innerHTML =
      `Você fez <strong>${s}</strong> ponto${s === 1 ? "" : "s"}.<br>` +
      `<span class="dim">Recorde: ${Math.floor(best)}</span>`;
    overlayBtn.textContent = "Jogar novamente";
    overlay.classList.remove("hidden");

    updateHUD();
  }

  /* =========================================================
     ENTRADA
     ========================================================= */
  function onInput() {
    if (state.phase === "ready") { startGame(); return; }
    if (state.phase === "playing") { tryJump(); return; }
    if (state.phase === "over" && performance.now() - overAt > 550) startGame();
  }

  function tryJump() {
    const b = state.ball;
    if (b.onGround || b.coyote > 0) {
      b.vy = CFG.jumpV;
      b.onGround = false;
      b.coyote = 0;
      b.jumpBuf = 0;
      b.squash = -0.42;
      burst(b.x, groundY, 9, "#a78bfa", 210);
    } else {
      b.jumpBuf = 0.13;
    }
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Enter") {
      e.preventDefault();
      onInput();
    }
  }, { passive: false });

  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); onInput(); });
  overlay.addEventListener("pointerdown", (e) => { e.preventDefault(); onInput(); });

  /* =========================================================
     PARTÍCULAS
     ========================================================= */
  function burst(x, y, n, color, spread) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * spread;
      const life = 0.45 + Math.random() * 0.6;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 90,
        r: 1.6 + Math.random() * 3.4,
        life, maxLife: life,
        color
      });
    }
  }

  function updateParticles(dt) {
    const arr = state.particles;
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.vy += 1400 * dt;
      p.vx *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) arr.splice(i, 1);
    }
  }

  /* =========================================================
     COLISÃO
     ========================================================= */
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function checkCollision() {
    const b = state.ball;
    const r = b.r * 0.9;
    for (const o of state.obstacles) {
      if (circleRect(b.x, b.y, r, o.x, o.y, o.w, o.h)) return true;
    }
    return false;
  }

  /* =========================================================
     OBSTÁCULOS — REGRAS DE GAME DESIGN
     =========================================================
     • Altura máxima ≤ 72% da altura do salto  → sempre saltável
     • Largura máxima ≤ 40% da distância do salto → sempre saltável
     • Espaçamento em TEMPO (não em distância) → densidade aumenta
       com a velocidade em vez de criar desertos visuais
     • Piso de tempo = AIR_TIME + reação (~0.85s) → sempre dá pra
       aterrissar e saltar de novo
     • Teto visual = 60% da largura → telas largas não ficam vazias
     ========================================================= */
  function spawnObstacle() {
    const speedRatio = Math.min(1,
      (state.speed - CFG.speedStart) / (CFG.speedMax - CFG.speedStart)
    );

    /* ---------- Dimensões (sempre saltáveis) ---------- */
    const minH = 26;
    const maxH = Math.min(JUMP_HEIGHT * 0.72, 55 + speedRatio * 50);
    const h    = minH + Math.random() * (maxH - minH);

    const jumpDist = state.speed * AIR_TIME;
    const minW = 18;
    const maxW = Math.min(jumpDist * 0.4, 32 + speedRatio * 38);
    const w    = minW + Math.random() * Math.max(6, maxW - minW);

    /* ---------- Cor por dificuldade ---------- */
    const norm = Math.min(1, (h - minH) / Math.max(1, maxH - minH));
    const hue  = 190 + norm * 140;
    const color = `hsl(${hue.toFixed(0)} 92% 62%)`;

    state.obstacles.push({ x: W + 44, y: groundY - h, w, h, color });

    /* ---------- Espaçamento baseado em TEMPO ----------
       Em velocidade baixa: 1.20s – 1.80s  (relaxado)
       Em velocidade alta:  0.85s – 1.00s  (tenso, mas justo)
       Como o intervalo em segundos DIMINUI conforme a velocidade
       sobe, a densidade de obstáculos por segundo AUMENTA.        */
    const minTime = 1.20 + (0.85 - 1.20) * speedRatio;
    const maxTime = 1.80 + (1.00 - 1.80) * speedRatio;
    const gapTime = minTime + Math.random() * (maxTime - minTime);

    let dist = state.speed * gapTime + w;

    /* Teto visual: nunca mais de 60% da largura da tela */
    const visualMax = W * 0.6;
    if (dist > visualMax) dist = visualMax;

    /* Piso justo: nunca menos que minTime entre obstáculos */
    const fairMin = state.speed * minTime + w;
    if (dist < fairMin) dist = fairMin;

    state.spawnCooldown = dist;
  }

  function moveObstacles(dt) {
    let travel = state.speed * dt;
    const steps = Math.max(1, Math.ceil(travel / 8));
    const step = travel / steps;

    for (let s = 0; s < steps; s++) {
      for (const o of state.obstacles) o.x -= step;
      if (checkCollision()) return true;
    }
    return false;
  }

  /* =========================================================
     UPDATE
     ========================================================= */
  function update(dt) {
    state.time += dt;
    updateParticles(dt);
    updateStars(dt);

    if (state.shake > 0.4) state.shake *= Math.pow(0.0006, dt);
    else state.shake = 0;

    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.2);

    const b = state.ball;

    /* física da bola (sempre ativa) */
    b.vy += CFG.gravity * dt;
    b.y  += b.vy * dt;

    const floor = groundY - b.r;
    if (b.y >= floor) {
      if (!b.onGround && b.vy > 220) {
        b.squash = 0.42;
        burst(b.x, groundY, 7, "#8b6dff", 180);
      }
      b.y = floor;
      b.vy = 0;
      b.onGround = true;
      b.coyote = 0.09;
    } else {
      b.onGround = false;
      b.coyote = Math.max(0, b.coyote - dt);
    }

    if (b.onGround && b.jumpBuf > 0) {
      b.jumpBuf = 0;
      tryJump();
    }
    b.jumpBuf = Math.max(0, b.jumpBuf - dt);

    b.squash += (0 - b.squash) * Math.min(1, dt * 11);
    b.rot += dt * (2.2 + state.speed / CFG.speedStart * 2.6) * (b.onGround ? 1 : 0.35);

    if (state.phase === "playing") {
      state.trail.unshift({ x: b.x, y: b.y });
      if (state.trail.length > 14) state.trail.pop();
    }

    if (state.phase !== "playing") return;

    /* progressão */
    state.t += dt;
    state.speed = Math.min(CFG.speedMax, CFG.speedStart + state.t * CFG.speedGain);
    state.score += state.speed * dt * CFG.scoreRate;
    state.scroll += state.speed * dt;

    /* obstáculos */
    if (moveObstacles(dt)) { gameOver(); return; }
    state.obstacles = state.obstacles.filter(o => o.x + o.w > -80);

    /* spawn */
    state.spawnCooldown -= state.speed * dt;
    if (state.spawnCooldown <= 0) spawnObstacle();

    updateHUD();
  }

  function updateStars(dt) {
    for (const s of stars) {
      s.x -= (6 + state.speed * s.depth * 0.09) * dt * 6;
      if (s.x < -6) {
        s.x = W + 6;
        s.y = Math.random() * groundY * 0.92;
      }
    }
  }

  let lastScoreShown = -1;
  function updateHUD() {
    const s = Math.floor(state.score);
    if (s !== lastScoreShown) { scoreEl.textContent = s; lastScoreShown = s; }
    bestEl.textContent = Math.floor(best);

    const ratio = (state.speed - CFG.speedStart) / (CFG.speedMax - CFG.speedStart);
    speedFill.style.width = (Math.max(0, Math.min(1, ratio)) * 100).toFixed(1) + "%";
    speedTxt.textContent = "x" + (state.speed / CFG.speedStart).toFixed(1);
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBlob(x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    "#07070f");
    g.addColorStop(0.55, "#0c0a1c");
    g.addColorStop(1,    "#130e26");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    const t = state.time;
    drawBlob(W * 0.24 + Math.sin(t * 0.16) * 70, H * 0.30, Math.max(W, H) * 0.38, "rgba(127,90,240,0.10)");
    drawBlob(W * 0.82 + Math.cos(t * 0.12) * 80, H * 0.55, Math.max(W, H) * 0.34, "rgba(44,182,125,0.075)");
    drawBlob(W * 0.55 + Math.sin(t * 0.21 + 2) * 60, H * 0.18, Math.max(W, H) * 0.26, "rgba(255,77,109,0.055)");
    ctx.globalCompositeOperation = "source-over";

    for (const s of stars) {
      const a = 0.22 + 0.5 * (0.5 + 0.5 * Math.sin(state.time * 2 + s.tw));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#cfc4ff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0,    "rgba(127,90,240,0.20)");
    g.addColorStop(0.22, "rgba(18,14,34,0.94)");
    g.addColorStop(1,    "#080611");
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, H - groundY);

    ctx.save();
    ctx.strokeStyle = "rgba(127,90,240,0.20)";
    ctx.lineWidth = 1.4;
    const spacing = 52;
    const off = state.scroll % spacing;
    for (let x = -off - spacing; x < W + spacing; x += spacing) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 8);
      ctx.lineTo(x - 22, H);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.shadowColor = "#7f5af0";
    ctx.shadowBlur = 20;
    ctx.strokeStyle = "rgba(168,140,255,0.95)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 1);
    ctx.lineTo(W, groundY + 1);
    ctx.stroke();
    ctx.restore();
  }

  function drawObstacles() {
    for (const o of state.obstacles) {
      ctx.save();
      ctx.shadowColor = o.color;
      ctx.shadowBlur = 18;

      const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
      g.addColorStop(0, o.color);
      g.addColorStop(1, "rgba(6,4,16,0.92)");

      ctx.fillStyle = g;
      roundRect(o.x, o.y, o.w, o.h, 8);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      roundRect(o.x + 3.5, o.y + 3.5, Math.max(2, o.w - 7), 3, 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawTrail() {
    const b = state.ball;
    const n = state.trail.length;
    for (let i = 0; i < n; i++) {
      const p = state.trail[i];
      const k = i / n;
      ctx.globalAlpha = (1 - k) * 0.22;
      ctx.fillStyle = "#8b6dff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, b.r * (0.3 + 0.62 * (1 - k)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBall() {
    const b = state.ball;
    const sx = 1 + b.squash * 0.75;
    const sy = 1 - b.squash * 0.75;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(sx, sy);

    ctx.save();
    ctx.shadowColor = "rgba(140,110,255,0.95)";
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-b.r * 0.34, -b.r * 0.42, b.r * 0.1, 0, 0, b.r * 1.06);
    g.addColorStop(0,   "#ffffff");
    g.addColorStop(0.42, "#b8a2ff");
    g.addColorStop(1,   "#5b21b6");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    ctx.rotate(b.rot);
    ctx.strokeStyle = "rgba(255,255,255,0.62)";
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0, 0, b.r * 0.54, -0.55, 1.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, b.r * 0.54, Math.PI - 0.55, Math.PI + 1.05); ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of state.particles) {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (state.shake > 0.6) {
      ctx.translate(
        (Math.random() - 0.5) * state.shake,
        (Math.random() - 0.5) * state.shake
      );
    }

    drawBackground();
    drawGround();
    drawObstacles();
    drawTrail();
    drawBall();
    drawParticles();

    ctx.restore();

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,60,90,${state.flash * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* =========================================================
     LOOP
     ========================================================= */
  let lastTime = performance.now();

  function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;

    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  /* =========================================================
     INICIALIZAÇÃO
     ========================================================= */
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  resize();
  state.ball.y = groundY - state.ball.r;
  bestEl.textContent = Math.floor(best);

  showReady();
  requestAnimationFrame(loop);
})();
</script>
</body>
